name: Dendrite CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        description: Full acceptance or CI-policy checks only (not release validation)
        type: choice
        options: [full, policy]
        default: full

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dendrite-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ github.repository_id == '1417119504' && ((github.event_name == 'pull_request' && (github.event.pull_request.user.login != 'dependabot[bot]' || github.triggering_actor == 'x-aero')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.actor_id == '167432977' && github.actor == 'x-aero' && github.triggering_actor == 'x-aero' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - id: plan
        name: Plan only necessary checks from trusted source
        env:
          GH_TOKEN: ${{ github.token }}
          DENDRITE_CI_SCOPE: ${{ github.workflow == 'Dendrite CI' && inputs.scope || 'full' }}
        run: node scripts/ci-policy.cjs plan
      - name: Test tooling and cost controls
        run: npm test
  rust:
    needs: plan
    if: ${{ needs.plan.outputs.native == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node 24
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - run: npm test
      - name: Require a version decision for changed expected parser output
        if: github.event_name == 'pull_request'
        env:
          DENDRITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-parser-version.cjs
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run test:desktop
  acceptance:
    name: CI acceptance
    needs: [plan, rust]
    if: ${{ always() && !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Require planned checks and reject stale PR results
        env:
          GH_TOKEN: ${{ github.token }}
          DENDRITE_PLAN_RESULT: ${{ needs.plan.result }}
          DENDRITE_NATIVE_REQUIRED: ${{ needs.plan.outputs.native }}
          DENDRITE_NATIVE_RESULT: ${{ needs.rust.result }}
        run: node scripts/ci-policy.cjs acceptance
