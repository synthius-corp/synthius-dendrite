# Automatic Dependabot PRs are disabled; security alerts remain enabled.
# Security-fix PRs are also disabled in repository settings.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: cargo
  directory: /src-tauri
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
