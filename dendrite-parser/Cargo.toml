[package]
name = "synthius-dendrite-parser"
version = "1.1.0"
description = "Deterministic source detection and corpus conversion for Synthius Dendrite"
authors = ["Synthius Team"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "synthius_dendrite_parser"
path = "src/lib.rs"

[[bin]]
name = "dendrite-parser"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
pdf-extract = "0.12.1"
quick-xml = "0.42"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

